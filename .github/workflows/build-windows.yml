name: build-windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"

    steps:
      - uses: actions/checkout@v7

      # tag 与 build/config.yml 的 version 必须一致，否则产物属性与 tag 对不上
      - name: Verify tag matches build/config.yml
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(grep -m1 '^  version:' build/config.yml | sed 's/.*"\([^"]*\)".*/\1/')
          echo "tag=$tag config.yml=$ver"
          [ "$tag" = "$ver" ] || { echo "::error::tag $tag 与 build/config.yml 的 $ver 不一致"; exit 1; }

      # Release 正文来自仓库内的 notes 文件，缺失就直接失败，避免发出空 Release
      - name: Verify release notes exist
        shell: bash
        run: |
          f=".github/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$f" ] || { echo "::error::缺少 $f"; exit 1; }

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 仅用于 frontend 构建，website 不参与
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Add GOPATH/bin to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # windows-latest 已切到 Server 2025 镜像：NSIS 可能已预装但不在 PATH，
      # 而 choco 安装也不会写 PATH，因此这里必须先定位、必要时安装，再显式写入 GITHUB_PATH。
      - name: Ensure NSIS in PATH
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS",
            "$env:ProgramFiles\NSIS",
            "C:\Program Files (x86)\NSIS",
            "C:\Program Files\NSIS"
          ) | Where-Object { $_ } | Select-Object -Unique

          function Find-NsisDir {
            foreach ($dir in $candidates) {
              if (Test-Path (Join-Path $dir 'makensis.exe')) { return $dir }
            }
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) { return (Split-Path $cmd.Source -Parent) }
            return $null
          }

          $nsisDir = Find-NsisDir
          if (-not $nsisDir) {
            Write-Host 'makensis.exe 未找到，开始安装 NSIS...'
            choco install nsis -y --no-progress
            $nsisDir = Find-NsisDir
          }
          if (-not $nsisDir) { throw '安装后仍未找到 makensis.exe，NSIS 不可用' }

          Write-Host "NSIS 目录: $nsisDir"
          $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # 同一 step 内后续命令需要用当前进程的 PATH
          $env:PATH = "$nsisDir;$env:PATH"

          $version = & (Join-Path $nsisDir 'makensis.exe') -VERSION
          Write-Host "makensis 版本: $version"

      # 单独一步构建，便于在日志中区分「编译失败」与「打包失败」
      - name: Build (Windows amd64)
        run: wails3 build GOOS=windows ARCH=amd64

      # package 依赖 build，会复用上一步产物；同时产出单文件 exe 与 NSIS 安装包
      - name: Package NSIS installer
        run: wails3 package GOOS=windows ARCH=amd64 INSTALL_SCOPE=machine

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem bin | Format-Table Name, Length, LastWriteTime

      - uses: actions/upload-artifact@v7
        with:
          name: my-folder-encryption-${{ github.ref_name }}
          path: |
            bin/my-folder-encryption.exe
            bin/my-folder-encryption-amd64-installer.exe
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            bin/my-folder-encryption.exe
            bin/my-folder-encryption-amd64-installer.exe
          fail_on_unmatched_files: true

      # 失败时打印关键环境信息，方便下次直接定位
      - name: Diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host '--- makensis ---'
          Get-Command makensis.exe -ErrorAction SilentlyContinue | Format-List Name, Source
          Write-Host '--- PATH ---'
          $env:PATH -split ';'
          Write-Host '--- bin ---'
          if (Test-Path bin) { Get-ChildItem bin | Format-Table Name, Length }
