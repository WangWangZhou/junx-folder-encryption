<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>文件夹隐藏工具</title>
    <link rel="stylesheet" href="/style.css"/>
</head>
<body>
<div class="app">
    <div class="app-main">
    <div class="tabs" role="tablist">
        <button class="tab active" data-tab="tabHide" data-i18n="tab.hide" type="button">隐藏</button>
        <button class="tab" data-tab="tabEnc" data-i18n="tab.enc" type="button">加密</button>
        <button class="tab" data-tab="tabOther" data-i18n="tab.other" type="button">其他</button>
        <button class="tab" data-tab="tabGeneral" data-i18n="tab.general" type="button">常规</button>
        <button class="tab" data-tab="tabAbout" data-i18n="tab.about" type="button">关于</button>
        <button id="pinTopBtn" class="pin-btn" type="button" aria-pressed="true" data-i18n-title="tip.alwaysOnTop" title="">
            <svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true">
                <path d="M6 1a4 4 0 0 0-4 4c0 3 4 6 4 6s4-3 4-6a4 4 0 0 0-4-4Zm0 2.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z" fill="currentColor"/>
            </svg>
        </button>
    </div>

    <div class="content">
        <section class="panel active" id="tabHide">
            <div class="subtabs" role="tablist">
                <button class="subtab active" data-sub="subA" data-i18n="sub.a" type="button">方案A</button>
                <button class="subtab" data-sub="subB" data-i18n="sub.b" type="button">方案B</button>
            </div>

            <section class="subpanel active" id="subA">
                <fieldset class="group">
                    <legend data-i18n="group.folder">文件夹隐藏</legend>
                    <div class="field-row">
                        <label for="targetPathA" data-i18n="field.targetPath">路径</label>
                        <input id="targetPathA" type="text" placeholder="例如 D:\Private\我的文件夹" data-i18n-placeholder="placeholder.path" autocomplete="off"/>
                    </div>
                    <div class="field-row">
                        <label for="newName" data-i18n="field.newName">改名</label>
                        <input id="newName" type="text" placeholder="选填：加密前先改名" data-i18n-placeholder="placeholder.newName" autocomplete="off"/>
                    </div>
                </fieldset>
                <div class="actions">
                    <button id="encryptBtnA" class="btn" data-i18n="btn.encrypt" type="button">加密</button>
                    <button id="decryptBtnA" class="btn" data-i18n="btn.decrypt" type="button">解密</button>
                </div>
            </section>

            <section class="subpanel" id="subB">
                <fieldset class="group">
                    <legend data-i18n="group.acl">文件夹隐藏</legend>
                    <div class="field-row">
                        <label for="targetPathD" data-i18n="field.targetPath">路径</label>
                        <input id="targetPathD" type="text" placeholder="例如 D:\Private\我的文件夹" data-i18n-placeholder="placeholder.path" autocomplete="off"/>
                    </div>
                </fieldset>
                <div class="actions">
                    <button id="encryptBtnD" class="btn" data-i18n="btn.encrypt" type="button">加密</button>
                    <button id="decryptBtnD" class="btn" data-i18n="btn.decrypt" type="button">解密</button>
                </div>
            </section>
        </section>

        <section class="panel enc" id="tabEnc">
            <fieldset class="group drop-target" id="encDrop" data-file-drop-target="enc">
                <legend data-i18n="group.enc">加密</legend>
                <div class="field-row">
                    <label for="encSrc" data-i18n="field.sourcePath">目标路径</label>
                    <input id="encSrc" type="text" placeholder="例如 D:\Private\报告.docx 或 D:\Private\我的文件夹" data-i18n-placeholder="placeholder.sourcePath" autocomplete="off"/>
                    <button id="encPick" class="btn small" data-i18n="btn.browse" type="button">浏览…</button>
                </div>
                <div class="field-row">
                    <label for="encOut" data-i18n="field.outName">输出名称</label>
                    <input id="encOut" type="text" placeholder="选填，默认同源名，自动加 .junx" data-i18n-placeholder="placeholder.outName" autocomplete="off"/>
                </div>
                <div class="field-row checkbox-row enc-check">
                    <label class="checkbox-label">
                        <input id="encDelete" type="checkbox"/>
                        <span data-i18n="chk.deleteOriginalPath">加密后删除原文件/文件夹，不放入回收站</span>
                    </label>
                </div>
            </fieldset>
            <div class="progress-wrap progress-text-only">
                <span class="progress-text" id="encText" data-i18n="progress.idle">就绪</span>
            </div>
            <div class="actions">
                <button id="encBatch" class="btn batch-toggle" data-i18n="btn.batch" type="button">批量</button>
                <button id="encStart" class="btn" data-i18n="btn.startEncrypt" type="button">开始加密</button>
                <button id="encDecrypt" class="btn" data-i18n="btn.startDecrypt" type="button">开始解密</button>
            </div>
        </section>

        <section class="panel" id="tabOther">
            <fieldset class="group general-group">
                <legend data-i18n="group.winTweaks">Windows 优化</legend>
                <div class="field-row tweak-row">
                    <button id="clearRecentBtn" class="btn small" data-i18n="btn.clearRecent" type="button">清除最近使用的文件记录</button>
                </div>
                <div class="field-row tweak-row">
                    <button id="showDesktopIconsBtn" class="btn small" data-i18n="btn.showDesktopIcons" data-i18n-title="tip.showDesktopIcons" title="" type="button">显示此电脑</button>
                </div>
                <div class="field-row tweak-row">
                    <button id="alignStartLeftBtn" class="btn small" data-i18n="btn.alignStartLeft" type="button">开始菜单左对齐</button>
                </div>
                <div class="field-row tweak-row">
                    <button id="showHiddenFilesBtn" class="btn small" data-i18n="btn.showHiddenFiles" data-i18n-title="tip.showHiddenFiles" title="" type="button">显示隐藏文件</button>
                </div>
                <div class="field-row tweak-row">
                    <button id="removeShortcutArrowBtn" class="btn small" data-i18n="btn.removeShortcutArrow" type="button">去掉桌面快捷方式的小箭头</button>
                </div>
            </fieldset>
        </section>

        <section class="panel" id="tabGeneral">
            <fieldset class="group general-group">
                <legend data-i18n="group.general">常规设置</legend>
                <button id="quitBtn" class="btn small group-corner icon-only" data-i18n-title="tip.quit" data-i18n-aria-label="btn.quit" title="" aria-label="退出" type="button">
                    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
                        <path d="M8 1.8v5.4M5.1 4.2a5 5 0 1 0 5.8 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <div class="field-row">
                    <label for="langSelect" data-i18n="field.language">显示语言:</label>
                    <select id="langSelect" class="lang-select">
                        <option value="zh-CN">简体中文</option>
                        <option value="en">English</option>
                        <option value="ja">日本語</option>
                    </select>
                </div>
                <div class="field-row checkbox-row">
                    <label class="checkbox-label">
                        <input id="autoStartChk" type="checkbox"/>
                        <span data-i18n="chk.autoStart">开机启动</span>
                    </label>
                    <label class="checkbox-label" id="runAsAdminLabel">
                        <input id="runAsAdminChk" type="checkbox" disabled/>
                        <span data-i18n="chk.runAsAdmin">以管理员身份启动</span>
                    </label>
                    <span id="adminInfo" class="info-icon" data-i18n-title="tip.runAsAdmin" title="">ⓘ</span>
                </div>
                <div class="field-row checkbox-row pin-row">
                    <label class="checkbox-label">
                        <input id="pinEnableChk" type="checkbox"/>
                        <span data-i18n="chk.pin">打开密码</span>
                    </label>
                    <label class="checkbox-label" id="autoLockLabel">
                        <input id="autoLockChk" type="checkbox"/>
                        <span data-i18n="chk.autoLock">自动锁定</span>
                    </label>
                    <button id="manualLockBtn" class="btn small" data-i18n="btn.manualLock" type="button">手动锁定</button>
                    <span id="pinInfo" class="info-icon" data-i18n-title="tip.pin" title="">ⓘ</span>
                </div>
            </fieldset>
            <fieldset class="group config-group">
                <legend data-i18n="group.config">配置管理</legend>
                <div class="field-row">
                    <label for="configPathInput" data-i18n="field.configPath">路径:</label>
                    <input id="configPathInput" type="text" value="config.jsonc" readonly/>
                </div>
                <div class="field-row config-actions">
                    <button id="openConfigFolderBtn" class="btn small" data-i18n="btn.openConfigFolder" data-i18n-title="tip.openConfigFolder" title="" type="button">打开所在文件夹</button>
                    <span class="config-action-right">
                        <button id="openConfigBtn" class="btn small" data-i18n="btn.openConfig" data-i18n-title="tip.openConfig" title="" type="button">打开</button>
                        <button id="changeConfigBtn" class="btn small" data-i18n="btn.changeConfig" data-i18n-title="tip.changeConfig" title="" type="button">更改</button>
                    </span>
                </div>
            </fieldset>
            <fieldset class="group log-setting-group">
                <legend data-i18n="group.log">日志管理</legend>
                <div class="field-row log-setting-row">
                    <label for="logLevelSelect" data-i18n="field.logLevel">日志级别:</label>
                    <select id="logLevelSelect" class="log-level-select">
                        <option value="off" data-i18n="logLevel.off">关</option>
                        <option value="trace" data-i18n="logLevel.trace">追踪</option>
                        <option value="debug" data-i18n="logLevel.debug">调试</option>
                        <option value="normal" data-i18n="logLevel.normal">普通</option>
                    </select>
                    <button id="openLogFileBtn" class="btn small" data-i18n="btn.openLogFile" type="button">打开日志文件</button>
                    <button id="clearLogBtn" class="btn small" data-i18n="btn.clearLog" data-i18n-title="tip.clearLog" title="" type="button">清空日志</button>
                </div>
            </fieldset>
            <div class="field-row general-reset-row">
                <button id="resetConfigBtn" class="btn small" data-i18n="btn.resetConfig" data-i18n-title="tip.resetConfig" title="" type="button">恢复默认</button>
            </div>
        </section>

        <section class="panel about" id="tabAbout">
            <fieldset class="group">
                <legend data-i18n="group.about">关于</legend>
                <p class="about-title" data-i18n="about.title">文件夹隐藏工具 1.1.0</p>
                <p data-i18n-html="about.hide"><b>文件夹隐藏（方案A / 方案B）</b>：只改目录名或权限，不加密内容。</p>
                <p data-i18n-html="about.enc"><b>加密（文件 / 文件夹）</b>：AES-256-GCM 打包为 <code>.junx</code>，内部文件名与目录树一并加密。</p>
                <p data-i18n-html="about.key"><b>密钥内置</b>：拿到本程序即可离线解密，适合防误看，不适合对抗专业取证。</p>
                <p data-i18n-html="about.dec">解密固定输出到 <code>.junx</code> 所在目录；重名自动追加 <code>(2)(3)</code>，绝不覆盖。</p>
                <p class="about-warn" data-i18n="about.warn">勾选“删除原文件”后不可恢复，请先备份。</p>
            </fieldset>
        </section>

        <div class="log-group" id="logGroup">
            <button id="clearLogMiniBtn" class="log-clear-btn" data-i18n-title="tip.clearLog" data-i18n-aria-label="btn.clearLog" title="" aria-label="清空日志" type="button">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true" focusable="false">
                    <g transform="rotate(35 8 8)" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M8 2.2V8" />
                        <path d="M5.6 8h4.8l-1 5.2H6.6z" />
                        <path d="M7.1 9.7v3.1M8.9 9.7v3.1" />
                    </g>
                </svg>
            </button>
            <div class="log" id="logBox"></div>
        </div>
    </div>

    </div>
</div>

<div id="pinSetupOverlay" class="overlay hidden">
    <div class="pin-dialog">
        <div class="pin-dialog-title" data-i18n="pin.setupTitle">设置 4 位打开密码</div>
        <div class="field-row pin-setup-row">
            <div id="setupPinBoxes" class="pin-boxes pin-boxes-large"></div>
        </div>
        <div class="field-row pin-setup-row">
            <div id="confirmPinBoxes" class="pin-boxes pin-boxes-large"></div>
        </div>
        <span id="pinSetupError" class="pin-setup-error"></span>
        <div class="pin-dialog-actions">
            <button id="pinClearBtn" class="btn small" data-i18n="btn.clear" type="button">清除</button>
            <button id="pinSaveBtn" class="btn small" data-i18n="btn.save" type="button">保存</button>
            <button id="pinCancelBtn" class="btn small" data-i18n="btn.cancel" type="button">取消</button>
        </div>
    </div>
</div>

<div id="lockOverlay" class="overlay hidden">
    <div class="unlock-view">
        <div id="unlockPin" class="pin-boxes pin-boxes-large"></div>
        <p id="unlockMessage" class="unlock-message"></p>
        <div class="unlock-actions">
            <button id="unlockBtn" class="btn unlock-btn" data-i18n="btn.unlock" type="button">解锁</button>
        </div>
    </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
